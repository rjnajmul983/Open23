name: Build Project Nexus Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-extract ProjectNexus_Godot43_Android.zip if present
        run: |
          if [ -f "ProjectNexus_Godot43_Android.zip" ]; then
            echo "Extracting ProjectNexus_Godot43_Android.zip..."
            unzip -o ProjectNexus_Godot43_Android.zip -d .
          fi
          ls -la

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK components via sdkmanager
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.3 Stable & Export Templates
        run: |
          GODOT_VER="4.3-stable"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VER}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          rm -rf godot.zip templates.tpz templates_tmp

      - name: Generate Android Debug Keystore & Configure Godot Editor Settings
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cat << EOF > "$HOME/.config/godot/editor_settings-4.3.tres"
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Assets & Export ARM64 Android APK
        run: |
          mkdir -p build
          godot --headless --import --quit || true
          godot --headless --export-debug "Android" "build/ProjectNexus-arm64.apk"
          ls -lh build/ProjectNexus-arm64.apk

      - name: Upload Project Nexus APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectNexus-ARM64-APK
          path: build/ProjectNexus-arm64.apk
          retention-days: 30
